<!DOCTYPE html>
<!--
  作者: 吴欢
  建立时间: 2026-11-23 16:20
  使用模型: DeepSeek-V4.1-Flash
  功能名称及简介: LLM 实践操作痕迹展示 - 课程实践中四项大模型能力的实测截图汇总
                  ① AI 客服（硅基流动 / 七牛 双平台热切换）② 知识库上传与问答
                  ③ 图像识别 ④ 语音识别。每个任务直接展示其运行截图，
                  页面顶部实时探测本地后端（8028）是否在线。
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLM 实践操作痕迹展示</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;
    background:radial-gradient(circle at 50% 0%,#fdf3e6,#fdf8f2 55%);color:#3a2f26;
    line-height:1.8;min-height:100vh}
  .wh_wrap{max-width:880px;margin:0 auto;padding:26px 16px 56px}

  .wh_head{text-align:center;padding:8px 0 18px}
  .wh_head .wh_tag{display:inline-block;font-size:12px;color:#b45309;background:#fdf3e6;
    border:1px solid #f0d9bc;border-radius:999px;padding:3px 13px;margin-bottom:12px}
  .wh_head h1{font-size:22px;letter-spacing:1px;color:#2c211a}
  .wh_head h1 b{color:#d9781f}
  .wh_head p{font-size:13px;color:#8b7b6b;margin-top:6px}

  .wh_status{display:flex;align-items:center;gap:8px;justify-content:center;
    font-size:12.5px;margin-top:12px;color:#8b7b6b}
  .wh_dot{width:9px;height:9px;border-radius:50%;background:#c9b9a6;flex:none}
  .wh_dot.wh_on{background:#2fa36b;box-shadow:0 0 0 3px rgba(47,163,107,.16)}
  .wh_dot.wh_off{background:#d9534f;box-shadow:0 0 0 3px rgba(217,83,79,.14)}

  .wh_grid{display:grid;grid-template-columns:1fr;gap:16px}
  .wh_card{position:relative;background:#fff;border:1px solid #efe4d5;border-radius:16px;
    padding:18px 18px 14px;box-shadow:0 6px 18px rgba(92,60,20,.06);
    transition:transform .18s ease,border-color .18s ease}
  .wh_card:hover{transform:translateY(-3px);border-color:#e8a75e}
  .wh_no{position:absolute;right:15px;top:12px;font-size:24px;font-weight:bold;
    color:#f6e7d2;font-family:Consolas,monospace;line-height:1}
  .wh_card h2{font-size:15.5px;color:#2c211a;margin-bottom:4px;padding-right:36px}
  .wh_dim{display:inline-block;font-size:11.5px;color:#b45309;background:#fdf3e6;
    border-radius:999px;padding:1px 9px;margin-bottom:8px}

  /* 测试截图 */

  .wh_shot{margin:10px 0 0;border:1px dashed #e2d3bd;border-radius:10px;
    padding:8px;background:#fdfaf5;text-align:center}
  .wh_shot img{width:100%;border-radius:6px;display:block}
  .wh_shot.wh_shot_empty img{display:none}

  /* 客服两张截图并排 */
  .wh_shot_pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .wh_shot_pair .wh_shot{margin:0}

  .wh_foot{text-align:center;margin-top:26px;font-size:13px;color:#8b7b6b}
  .wh_foot a{color:#8b7b6b;text-decoration:none;margin:0 10px}
  .wh_foot a:hover{color:#d9781f}

  @media (max-width:620px){
    .wh_grid{grid-template-columns:1fr}
    .wh_head h1{font-size:19px}
    .wh_shot_pair{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="wh_wrap">

  <div class="wh_head">
    <span class="wh_tag">课程实践 · 大模型能力</span>
    <h1>LLM 实践<span style="color:#d9781f">操作痕迹</span>展示</h1>
    <p>四项大模型能力的实测截图：AI 客服（硅基流动 / 七牛）、知识库问答、图像识别、语音识别。</p>
    <div class="wh_status">
      <span class="wh_dot" id="whDot"></span>
      <span id="whStatusText">正在检测本地后端…</span>
    </div>
  </div>

  <div class="wh_grid">

    <div class="wh_card">
      <span class="wh_no">01</span>
      <h2>AI 客服 · 双平台热切换</h2>
      <span class="wh_dim">硅基流动 / 七牛</span>
      <div class="wh_shot_pair">
        <figure class="wh_shot" data-wh-shot>
          <img src="shots/kefu-siliconflow.png" alt="AI 客服测试截图（硅基流动）">
        </figure>
        <figure class="wh_shot" data-wh-shot>
          <img src="shots/kefu-qiniu.png" alt="AI 客服测试截图（七牛云）">
        </figure>
      </div>
    </div>

    <div class="wh_card">
      <span class="wh_no">02</span>
      <h2>知识库 · 上传与问答</h2>
      <span class="wh_dim">自己的文件</span>
      <figure class="wh_shot" data-wh-shot>
        <img src="shots/kb.png" alt="知识库测试截图">
      </figure>
    </div>

    <div class="wh_card">
      <span class="wh_no">03</span>
      <h2>图像识别</h2>
      <span class="wh_dim">上传图片</span>
      <figure class="wh_shot" data-wh-shot>
        <img src="shots/vision.png" alt="图像识别测试截图">
      </figure>
    </div>

    <div class="wh_card">
      <span class="wh_no">04</span>
      <h2>语音识别</h2>
      <span class="wh_dim">录音或上传音频</span>
      <figure class="wh_shot" data-wh-shot>
        <img src="shots/asr.png" alt="语音识别测试截图">
      </figure>
    </div>

  </div>

  <div class="wh_foot">
    <a href="../index.html">返回课程实践首页</a>
    <a href="../wh_prompt.md">提示词记录</a>
  </div>
</div>

<script>
  /**
   * 功能: wh_checkBackend
   * 简介: 请求本地后端的知识库文件接口，用返回结果判断 8028 服务是否在线，
   *       在线显示绿点与"后端已连接"，离线显示红点并提示启动命令。
   * 作者: 吴欢
   * 建立时间: 2026-11-23 16:20
   * 使用模型: DeepSeek-V4.1-Flash
   */
  function wh_checkBackend() {
    var whDot = document.getElementById('whDot');
    var whText = document.getElementById('whStatusText');

    fetch('http://localhost:8028/api/kb/files')
      .then(function (whRes) { return whRes.json(); })
      .then(function (whJson) {
        if (whJson && whJson.code === 0) {
          whDot.className = 'wh_dot wh_on';
          whText.textContent = '后端已连接 · http://localhost:8028 · 知识库文件 ' + (whJson.data.total || 0) + ' 个';
        } else {
          throw new Error('返回异常');
        }
      })
      .catch(function () {
        whDot.className = 'wh_dot wh_off';
        whText.textContent = '后端未连接，请先运行 node llm-backend/app.js（端口 8028）';
      });
  }

  /**
   * 功能: wh_bindShots
   * 简介: 检查每张测试截图是否已放入 llm/shots；图片加载失败或尺寸为 0 时给外层加上
   *       wh_shot_empty，隐藏破图，放入后自动显示截图。
   * 作者: 吴欢
   * 建立时间: 2026-11-23 17:00
   * 使用模型: DeepSeek-V4.1-Flash
   */
  function wh_bindShots() {
    var whShots = document.querySelectorAll('[data-wh-shot]');
    for (var whIndex = 0; whIndex < whShots.length; whIndex += 1) {
      (function (whFig) {
        var whImg = whFig.querySelector('img');
        if (!whImg) {
          return;
        }
        function whMarkEmpty() {
          whFig.classList.add('wh_shot_empty');
        }
        whImg.addEventListener('error', whMarkEmpty);
        whImg.addEventListener('load', function () {
          whFig.classList.remove('wh_shot_empty');
        });
        if (whImg.complete && whImg.naturalWidth === 0) {
          whMarkEmpty();
        }
      })(whShots[whIndex]);
    }
  }

  wh_checkBackend();
  wh_bindShots();
</script>
</body>
</html>
